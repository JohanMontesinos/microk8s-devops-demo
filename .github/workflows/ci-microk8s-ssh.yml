# CI/CD pipeline — runs directly on jnode2 via self-hosted runner.
# No port forwarding or SSH from the internet required.
# jnode2 connects outbound to GitHub to pick up jobs.
#
# Runner setup: see docs/README.md Part F

name: Build and Deploy to MicroK8s

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "charts/**"
      - "manifests/**"

jobs:
  deploy:
    name: Deploy on jnode2
    runs-on: self-hosted   # executes directly on jnode2 — no SSH needed

    steps:
      # Checkout puts the repo files directly on jnode2
      - name: Checkout repository
        uses: actions/checkout@v4

      # Everything runs locally on jnode2 — no SSH, no rsync
      - name: Build image, push to local registry, helm upgrade
        run: |
          set -euo pipefail
          NODE1_IP=$(hostname -I | awk '{print $1}')
          REGISTRY="${NODE1_IP}:32000"

          echo "==> Building ${REGISTRY}/webapp:latest ..."
          docker build -t "${REGISTRY}/webapp:latest" app/

          echo "==> Pushing to local registry ..."
          docker push "${REGISTRY}/webapp:latest"

          echo "==> Verifying image in registry ..."
          curl -sf "http://${REGISTRY}/v2/webapp/tags/list"

          echo "==> Helm upgrade ..."
          microk8s helm3 upgrade webapp charts/webapp \
            --set "image.repository=${REGISTRY}/webapp" \
            --set "image.tag=latest" \
            --reuse-values \
            --wait \
            --timeout 5m \
            --namespace default

          echo "==> Deploy complete. Current pods:"
          microk8s kubectl get pods -o wide --namespace default
