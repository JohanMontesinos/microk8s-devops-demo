# ArgoCD Application manifest.
# Prerequisites:
#   1. Gitea running locally (see docs/README.md - GitOps section).
#   2. This repo pushed to Gitea as http://192.168.0.102:3000/johan/microk8s-devops-demo.git
#   3. ArgoCD installed via: ./scripts/setup-argocd.sh
#
# REPLACE all occurrences of 192.168.0.102 with your actual LAN IP before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default

  # ── Source: local Gitea repository ────────────────────────────────────────
  source:
    # REPLACE 192.168.0.102 with the real LAN IP of Node1
    repoURL: "http://192.168.0.102:3000/johan/microk8s-devops-demo.git"
    targetRevision: HEAD
    path: charts/webapp        # Path inside the repo where the Helm chart lives
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # Override image repository at sync time so ArgoCD always uses the local registry
        - name: image.repository
          value: "192.168.0.102:32000/webapp"

  # ── Destination: local cluster ────────────────────────────────────────────
  destination:
    server: https://kubernetes.default.svc   # In-cluster API server address
    namespace: default

  # ── Sync policy: automated, self-healing ──────────────────────────────────
  syncPolicy:
    automated:
      prune: true       # Delete Kubernetes resources that are removed from Git
      selfHeal: true    # Re-apply if someone manually edits the live cluster state
    syncOptions:
      - CreateNamespace=true
